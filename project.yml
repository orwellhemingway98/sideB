name: SideB
options:
  bundleIdPrefix: com.mfelouro
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  SideB:
    type: application
    platform: macOS
    sources: [SideB]
    info:
      path: SideB/App/Info.plist
      properties:
        CFBundleName: sideB
        CFBundleDisplayName: sideB
        CFBundleShortVersionString: "0.16.16"
        CFBundleVersion: "67"
        LSApplicationCategoryType: public.app-category.music
        LSUIElement: true
        NSAppleEventsUsageDescription: "sideB controls Apple Music and Spotify so it can show what's playing and play, pause, skip or scrub it."
        NSAppTransportSecurity:
          # Many podcast feeds and their artwork are still plain http.
          NSAllowsArbitraryLoads: true
    entitlements:
      path: SideB/App/SideB.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mfelouro.SideB
        PRODUCT_NAME: sideB
        PRODUCT_MODULE_NAME: SideB
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: NO
  SideBTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SideBTests]
    dependencies:
      - target: SideB
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/sideB.app/Contents/MacOS/sideB"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SideB:
    build:
      targets:
        SideB: all
    test:
      targets: [SideBTests]
